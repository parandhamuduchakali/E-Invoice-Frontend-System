name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  schedule:
    # Weekly, so a vulnerability published in a dependency is noticed even
    # when nobody has pushed.
    - cron: "23 3 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The backend's committed OpenAPI contract, which src/api/schema.d.ts is
      # generated from. Checked out beside this repo, as on a developer machine.
      #
      # Both repositories are private, so the default token cannot read the
      # other one: add a repository secret BACKEND_REPO_TOKEN — a fine-grained
      # PAT with read access to E-Invoice-Backend-system's contents.
      - uses: actions/checkout@v4
        with:
          repository: parandhamuduchakali/E-Invoice-Backend-system
          token: ${{ secrets.BACKEND_REPO_TOKEN }}
          path: ../E-Invoice-Backend-system
          sparse-checkout: docs/openapi.json
          sparse-checkout-cone-mode: false

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci

      # Known vulnerabilities in what ships to the browser or runs the build.
      # `high` rather than `moderate`: the moderate tier is mostly dev-tooling
      # ReDoS that never sees untrusted input here, and a gate that is always
      # red is a gate nobody reads.
      - name: Dependency vulnerabilities
        run: npm audit --audit-level=high

      # Regenerate the API types from the backend's contract and fail if the
      # committed file differs: either the backend changed and nobody
      # regenerated, or someone edited the generated file by hand.
      - name: API types match the backend contract
        run: |
          npm run gen:api
          git diff --exit-code -- src/api/schema.d.ts || {
            echo "::error::src/api/schema.d.ts is out of date with the backend's docs/openapi.json. Run 'npm run gen:api' and commit."
            exit 1
          }

      # tsc in --noEmit mode: the build below would catch type errors too, but
      # a separate step names the failure instead of burying it in a bundle log.
      # This is also where src/api/contract.ts fails if a hand-written type in
      # src/api/types.ts has drifted from the generated schema.
      - name: Typecheck (includes the API contract assertions)
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # The entry bundle is what a first visit downloads before anything
      # renders. Routes are code-split to keep it down (see src/App.tsx), and
      # this fails the build if that regresses rather than letting it drift.
      - name: Entry bundle stays under budget
        run: |
          BUDGET_KB=340
          ENTRY=$(ls -S dist/assets/index-*.js | head -1)
          SIZE_KB=$(( $(stat -c%s "$ENTRY") / 1024 ))
          echo "entry bundle: $ENTRY = ${SIZE_KB} KB (budget ${BUDGET_KB} KB)"
          if [ "$SIZE_KB" -gt "$BUDGET_KB" ]; then
            echo "::error::Entry bundle ${SIZE_KB} KB exceeds the ${BUDGET_KB} KB budget."
            exit 1
          fi

  # The SPA's API layer against the real backend, end to end: register, seller
  # profile, client, invoice, INV-01, IRN, RBAC, refresh cookie. This is the
  # only place the two repositories are proven to agree at runtime rather than
  # merely at the type level.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: parandhamuduchakali/E-Invoice-Backend-system
          token: ${{ secrets.BACKEND_REPO_TOKEN }}
          path: backend

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      # The light set the backend's own CI uses: everything but the OCR models.
      - name: Install and start the backend
        working-directory: backend
        env:
          ENVIRONMENT: development
          IRP_BACKEND: mock
          DATABASE_URL: sqlite+aiosqlite:///./e2e.db
          LOG_LEVEL: WARNING
        run: |
          python -m pip install --upgrade pip
          pip install \
            fastapi==0.141.1 'uvicorn[standard]==0.52.4' \
            sqlalchemy==2.0.35 aiosqlite==0.20.0 alembic==1.13.3 greenlet==3.1.1 \
            'python-jose[cryptography]==3.5.0' bcrypt==5.0.0 python-multipart==0.0.32 \
            'pydantic[email]==2.9.2' pydantic-settings==2.5.2 python-dotenv==1.2.3 \
            httpx==0.27.2 arq==0.26.1 redis==5.0.8 \
            'numpy>=1.26,<2.4' opencv-contrib-python-headless==4.10.0.84 'pymupdf>=1.24'
          uvicorn app.main:app --host 127.0.0.1 --port 8000 > api.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8000/ready >/dev/null && break; sleep 1; done
          curl -fsS http://127.0.0.1:8000/ready || { cat api.log; exit 1; }

      - run: npm ci
      - name: Frontend API layer against the live backend
        env:
          E2E_BASE_URL: http://127.0.0.1:8000
          VITE_API_BASE_URL: http://127.0.0.1:8000
        run: npx vitest run e2e

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # gitleaks scans history, not just the tip

      # A VITE_* variable with a key in it ends up in the bundle for every
      # visitor to read. Catch it at the commit.
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
